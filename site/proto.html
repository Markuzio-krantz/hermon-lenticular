<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>אב־טיפוס: עננים נפחיים מעל החרמון</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f3f1ee; --ink-2: #c9cdd6; --ink-3: #9aa1b4; --glass: rgb(14 16 24 / .62); --hair: rgb(255 255 255 / .12); --accent: #ff9fb8; }
  html, body { margin: 0; height: 100%; background: #0b0c12; color: var(--ink); font-family: 'IBM Plex Sans Hebrew', system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .bar { position: fixed; z-index: 5; inset-inline: 12px; top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .bar h1 { margin: 0 0 0 auto; font-size: .95rem; font-weight: 500; text-shadow: 0 1px 8px rgb(0 0 0 / .6); }
  .bar small { display: block; color: var(--ink-3); font-size: .72rem; font-weight: 400; }
  .chip { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--hair); background: var(--glass); color: var(--ink); font: inherit; font-size: .82rem; backdrop-filter: blur(10px); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .chip[aria-pressed="true"] { background: var(--accent); color: #23121a; border-color: transparent; }
  .panel { position: fixed; z-index: 5; inset-inline-start: 12px; bottom: 12px; width: min(330px, calc(100vw - 24px)); padding: 12px 14px; border-radius: 16px; background: var(--glass); border: 1px solid var(--hair); backdrop-filter: blur(12px); display: grid; gap: 8px; font-size: .82rem; }
  .panel label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; color: var(--ink-2); }
  .panel input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .panel output { font: .76rem 'IBM Plex Mono', monospace; color: var(--ink); direction: ltr; }
  .panel p { margin: 0; color: var(--ink-3); font-size: .76rem; line-height: 1.5; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #status { position: fixed; z-index: 6; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: .9rem; color: var(--ink-2); }
  .panel.folded > :not(#fps) { display: none; }
  .panel.folded { width: auto; padding: 6px 10px; }
  #fps { font: .72rem 'IBM Plex Mono', monospace; color: var(--ink-3); direction: ltr; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="status">טוען את האטמוספרה והעננים…</div>
<header class="bar">
  <h1>אב־טיפוס: עננים נפחיים ואטמוספרה פיזיקלית<small>הפיזיקה שלנו קובעת איפה העדשות; Takram מצייר אותן</small></h1>
  <button class="chip" id="hide" type="button" aria-expanded="true">הסתרה</button>
  <a class="chip" href="./">חזרה לאתר</a>
</header>
<section class="panel" aria-label="כוונון">
  <div class="row" role="group" aria-label="נקודת מבט">
    <button class="chip" type="button" data-v="hula" aria-pressed="true">מהעמק</button>
    <button class="chip" type="button" data-v="near">ליד העדשה</button>
    <button class="chip" type="button" data-v="above">מעל</button>
  </div>
  <label>שעה (שעון ישראל) <output id="o-time"></output><input id="time" type="range" min="900" max="1050" step="1" value="995"></label>
  <label>כמה מהעדשה נראה <output id="o-cov"></output><input id="cov" type="range" min="0.2" max="0.95" step="0.01" value="0.62"></label>
  <label>איכות <output id="o-q"></output><input id="q" type="range" min="0" max="3" step="1" value="1"></label>
  <p>19.11.2026 מעל החרמון. שני לוחות העדשה (3.5–4.05 ו־4.05–4.8 ק"מ) וענן הכובע מגיעים מאותו מודל גלי הרים של האתר.</p>
  <div id="fps"></div>
</section>
<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.172.0",
    "three/": "https://esm.sh/three@0.172.0/",
    "postprocessing": "https://esm.sh/*postprocessing@6.37.6",
    "@takram/three-geospatial": "https://esm.sh/*@takram/three-geospatial@0.9.1",
    "@takram/three-geospatial/": "https://esm.sh/*@takram/three-geospatial@0.9.1/",
    "@takram/three-atmosphere": "https://esm.sh/*@takram/three-atmosphere@0.19.1",
    "@takram/three-atmosphere/": "https://esm.sh/*@takram/three-atmosphere@0.19.1/",
    "@takram/three-clouds": "https://esm.sh/*@takram/three-clouds@0.7.6",
    "@takram/three-clouds/": "https://esm.sh/*@takram/three-clouds@0.7.6/",
    "tiny-invariant": "https://esm.sh/tiny-invariant@1.3.3",
    "@petamoriken/float16": "https://esm.sh/@petamoriken/float16@3.9.3",
    "astronomy-engine": "https://esm.sh/astronomy-engine@2.1.19",
    "url-join": "https://esm.sh/url-join@5.0.0",
    "react-merge-refs": "https://esm.sh/react-merge-refs@3.0.2"
  }
}
</script>
<script type="module" src="js/proto.js"></script>
</body>
</html>
